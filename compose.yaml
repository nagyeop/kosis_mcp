services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-6}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_CORS_ORIGIN: ${MCP_CORS_ORIGIN:-*}
      ACCESS_LOG: ${ACCESS_LOG:-0}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
