[project]
name = "kosis-mcp"
version = "2.0.0"
description = "한국 국가데이터처 KOSIS OpenAPI 기반 MCP 서버 (FastMCP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.4.7",
  "httpx>=0.27",
  "langfuse>=3.3.1",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "redis>=5.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
kosis-mcp = "kosis_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosis_mcp"]

[tool.hatch.build]
include = [
  "src/kosis_mcp/**/*.py",
  "src/kosis_mcp/**/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "app:app"
